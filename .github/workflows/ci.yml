name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} · Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release notes
        if: runner.os == 'Linux'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --force --tags origin
          node scripts/release-notes.cjs check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Smoke-check Windows runtime discovery
        if: runner.os == 'Windows'
        run: npm run smoke:windows

      - name: Smoke-check macOS runtime discovery
        if: runner.os == 'macOS'
        run: npm run smoke:macos

      - name: Smoke-check Linux runtime discovery
        if: runner.os == 'Linux'
        run: npm run smoke:linux
